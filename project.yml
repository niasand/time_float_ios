name: TimeFloat
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
targets:
  TimeFloat:
    type: application
    platform: iOS
    sources:
      - path: TimeFloat
        excludes:
          - Info.plist
          - TimeFloat.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        INFOPLIST_FILE: TimeFloat/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimeFloat/TimeFloat.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - target: TimeFloatWidget
        embed: true
  TimeFloatWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TimeFloatWidget
        excludes:
          - Info.plist
          - TimeFloatWidget.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIDGET_BUNDLE_ID)"
        INFOPLIST_FILE: TimeFloatWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimeFloatWidget/TimeFloatWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  TimeFloat:
    build:
      targets:
        TimeFloat: all
    run:
      config: Debug
